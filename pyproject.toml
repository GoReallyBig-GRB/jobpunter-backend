[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpunter-backend"
version = "0.1.0"
description = "JobPunter backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "httpcore>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "python-jobspy>=1.1.0,<2",
  "Scrapy>=2.12,<3",
  "playwright>=1.50,<2",
  "firebase-admin>=6.5,<8",
  "google-genai>=1.0,<3",
  "openai>=1.68,<3",
  "google-cloud-storage>=2.18,<4",
  "boto3>=1.35,<2",
  "google-api-python-client>=2.150,<3",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "PyMuPDF>=1.25,<2",
  "google-cloud-vision>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: opt-in tests that contact approved external services; skipped by default",
]
[tool.setuptools.packages.find]
include = ["app", "app.*", "migrations", "migrations.*"]
