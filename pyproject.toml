[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpunter-backend"
version = "0.1.0"
description = "JobPunter backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "python-jobspy>=1.1.0,<2",
  "Scrapy>=2.12,<3",
  "playwright>=1.50,<2",
  "firebase-admin>=6.5,<8",
  "google-genai>=1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["app", "app.*", "migrations", "migrations.*"]
