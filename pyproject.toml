[project]
name = "jobpunter-backend"
version = "0.2.0"
description = "JobPunter production backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
