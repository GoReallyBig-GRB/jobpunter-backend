name: bootstrap repository
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap JobPunter backend baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore baseline
        run: |
          printf '%s' '' | base64 -d > /tmp/repo.tgz
          tar -xzf /tmp/repo.tgz
          rm -f .github/workflows/bootstrap.yml bootstrap.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Restore backend foundation from verified baseline'
          git push
