name: backend verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobpunter
          POSTGRES_USER: jobpunter
          POSTGRES_PASSWORD: jobpunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpunter -d jobpunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobpunter:jobpunter@localhost:5432/jobpunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall app migrations
      - run: pytest -q
      - name: Validate a single Alembic head
        run: alembic heads
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - name: Verify ORM and database schema parity
        run: alembic check
