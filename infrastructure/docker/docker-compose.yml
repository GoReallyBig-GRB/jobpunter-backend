services:
  postgres:
    image: postgres:17
    container_name: jobpunter-postgres
    environment:
      POSTGRES_DB: jobpunter
      POSTGRES_USER: jobpunter
      POSTGRES_PASSWORD: jobpunter
    ports:
      - "5432:5432"
    volumes:
      - jobpunter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpunter -d jobpunter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobpunter-postgres:
