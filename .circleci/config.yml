version: 2.1

jobs:
  backend-verification:
    docker:
      - image: cimg/python:3.12
      - image: postgres:17
        environment:
          POSTGRES_USER: jobpunter
          POSTGRES_PASSWORD: jobpunter
          POSTGRES_DB: jobpunter
    resource_class: small
    environment:
      DATABASE_URL: postgresql+psycopg://jobpunter:jobpunter@127.0.0.1:5432/jobpunter
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "pyproject.toml" }}
            - v1-pip-
      - run:
          name: Install backend and test dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
            python -m playwright install --with-deps chromium
            python -m pip freeze
      - save_cache:
          key: v1-pip-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for PostgreSQL 17
          command: |
            python - <<'PY'
            import time
            import psycopg

            connection = (
                "host=127.0.0.1 port=5432 dbname=jobpunter "
                "user=jobpunter password=jobpunter connect_timeout=2"
            )
            for attempt in range(30):
                try:
                    with psycopg.connect(connection):
                        print("PostgreSQL is ready.")
                    break
                except Exception:
                    if attempt == 29:
                        raise
                    time.sleep(2)
            PY
      - run:
          name: Compile Python modules
          command: python -m compileall app migrations
      - run:
          name: Validate a single Alembic head
          command: |
            python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); print(heads); assert len(heads) == 1, f'Expected one migration head, found {len(heads)}'"
      - run:
          name: Upgrade from prior revision and verify legacy revision-stamp compatibility
          command: |
            alembic upgrade 0031_candidate_profile_data
            alembic upgrade 0032_candidate_fact_provenance
            python - <<'PY'
            import os
            from sqlalchemy import create_engine, text

            engine = create_engine(os.environ["DATABASE_URL"])
            with engine.begin() as connection:
                connection.execute(
                    text("ALTER TABLE alembic_version ALTER COLUMN version_num TYPE VARCHAR(64)")
                )
                connection.execute(
                    text("UPDATE alembic_version SET version_num = :legacy"),
                    {"legacy": "0032_candidate_profile_fact_provenance"},
                )
            engine.dispose()
            PY
            alembic upgrade head
      - run:
          name: Verify ORM and database schema parity
          command: alembic check
      - run:
          name: Run unit and PostgreSQL integration tests
          command: |
            mkdir -p test-results
            pytest -q --junitxml=test-results/junit.xml
          no_output_timeout: 20m
      - store_test_results:
          path: test-results

workflows:
  backend-verification:
    jobs:
      - backend-verification
